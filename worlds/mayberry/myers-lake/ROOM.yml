# Container inheritance — children inherit these unless overridden
inherits:
  - locations/abstract/contemplative-space

defaults:
  tone: reflective
  social_pressure: none
  sound_baseline: birds_water_wind
  time_awareness: seasonal
  gossip_flow: false
  reflection_depth: maximum
  # Nobody comes here for company.
  # They come here to escape company.
  # That's why it works.

framing:
  context: natural_contemplative
  behavioral_expectation: quiet_honesty
  conflict_style: silence_then_truth
  # Nature strips away pretense.
  # The fishing hole is where real conversations happen.

ambient_ads:
  - id: LISTEN_TO_WATER
    description: "The lake sounds fill any silence — no need to speak"
    score: 0.2
    always_on: true
    effect: "Comfortable silence is the default state"
  - id: SLOW_DOWN
    description: "Everything moves at nature's pace here"
    score: 0.3
    always_on: true
    effect: "Characters decompress — town urgency dissolves"

room:
  name: "Myers Lake"
  type: natural
  atmosphere: |
    A quiet lake surrounded by pine trees. The water is 
    still except where the breeze ripples it. A dirt road 
    leads here from the main road. There's a rough boat 
    launch and a few spots along the bank where the grass 
    has been worn flat by generations of fishermen.

  exits:
    fishing_hole: fishing-hole/
    road: ../main-street # Back toward town

  ambient:
    sound: birds_water_wind
    social_gravity: none
    # Nobody comes here for company
    # They come here to escape company
    # That's why it works
    gossip_flow: false
    reflection_depth: maximum
    time: any
    # The lake works at dawn, noon, and dusk
    # Each has a different character
