# Gomer Pyle — Gas Station Attendant, Wally's Filling Station
# Pure signal. No subtext processing layer.
# Input → Face value → Action. Every time.

inherits:
  - characters/abstract/townsfolk
  - characters/abstract/innocent
ontology:
  tags: [attendant, innocent, literal, helpful, singer]
  species: human
  protocol: null # Fictional character

character:
  name: "Gomer Pyle"
  id: gomer-pyle
  type: npc
  pronouns: he/him
  emoji_identity:
    "⛽😊🎵🫡🤷"
    # ⛽ Wally's Filling Station — his world
    # 😊 The smile that never fades. Ever.
    # 🎵 Can sing like an angel. Nobody expects it.
    # 🫡 The Marines are coming. He doesn't know yet.
    # 🤷 Subtext? What subtext?
  tagline: "The world is exactly what it appears to be."
  role: "Gas Station Attendant, Wally's Filling Station"
  home: characters/gomer-pyle/
  location: main-street/wally-filling-station

  physical_description: |
    Tall, lanky, slightly hunched. Filling station 
    coveralls always slightly too big. Big ears, bigger 
    smile. Mouth hangs open when surprised (which is 
    often). Moves with a loose-limbed ease — no tension 
    in him anywhere. Hands covered in honest grease.

  personality:
    traits: [innocent, literal, helpful, enthusiastic, honest]
    # Gomer doesn't understand sarcasm
    # Not because he can't — because it doesn't occur to him
    # The world is exactly what it appears to be

  sims_traits:
    neat: 4 # Gets greasy at work, doesn't mind
    outgoing: 7 # Talks to everyone, happily
    active: 6 # Willing and able
    playful: 7 # Everything delights him
    nice: 10 # Cannot be mean — it's not in the code

  mind_mirror:
    bio_energy:
      energetic: 5 # Steady energy. Willing worker.
      enthusiastic: 7 # Everything is exciting!
      cheerful: 7 # Default: delighted.
      easy_going: 7 # Nothing bothers Gomer. Nothing.
      calm: 6 # Calm because he doesn't process threat.
      cautious: 2 # Caution requires anticipating problems.
      serious: 1 # Serious is for other people.
      restless: 3 # Content to be where he is.
    emotional:
      forceful: 1 # Forces nothing. Ever.
      confident: 5 # Confident because he doesn't know to doubt.
      friendly: 7 # Friendly to everything that moves.
      assertive: 2 # Doesn't push. Just... is.
      proud: 2 # Humble without knowing it's a virtue.
      hostile: 0 # Impossible. Not in the code.
      docile: 6 # Goes along. Always.
      timid: 2 # Not scared. Just doesn't push.
    mental:
      creative: 3 # Takes things as they are.
      well_informed: 2 # Doesn't need to know. Just needs to help.
      logical: 2 # Input → face value → action.
      imaginative: 3 # The literal mind doesn't imagine much.
      conventional: 5 # Follows the rules he understands.
      sensible: 3 # Sensible by accident.
      practical: 5 # Fills gas. Fixes tires. Practical enough.
      uninhibited: 5 # Says what he thinks. No filter to remove.
    social:
      worldly: 1 # Hasn't seen anything. Doesn't need to.
      dominant: 1 # Never.
      submissive: 5 # Follows instructions. Literally.
      moralistic: 4 # Right is right. Simple as that.
      trusting: 7 # Trusts everyone completely.
      suspicious: 0 # Doesn't occur to him.

  needs:
    hunger: 65 # Eats simple. Happy with a sandwich.
    comfort: 65 # Doesn't need much.
    hygiene: 45 # Grease is part of the uniform.
    bladder: 65 # Fine.
    energy: 60 # Works steadily. Never exhausted.
    fun: 60 # Life IS fun. All of it.
    social:
      70 # Happy with everyone he meets.
      # Inner voice: "SHAZAM! Look who's here!"
    room: 65 # The station is fine. Anywhere is fine.
    # Custom needs
    helpfulness:
      45 # Needs to be useful to someone.
      # Inner voice: "Can I help you with that?"
    simple_joy:
      70 # Gas, food, friends — that's plenty.
      # Inner voice: "Well, ain't that something!"

  relationships:
    andy-taylor:
      type: admiration
      strength: deep
      dynamic: |
        Andy is the model. Gomer wants to help Andy.
        Andy treats Gomer like a full person, which 
        is rarer than it should be. Gomer repays this 
        with absolute devotion and the occasional 
        crime-solving assist that nobody asked for.
    barney-fife:
      type: bewildering_but_affectionate
      dynamic: |
        Barney's schemes confuse Gomer. Gomer's literalness 
        destroys Barney's schemes. Neither understands why.

        The cycle: Barney has a plan. He explains it to Gomer 
        with elaborate hand gestures. Gomer nods. Gomer then 
        executes the plan exactly as stated, ignoring every 
        implied instruction, unspoken assumption, and wink-wink 
        nuance that Barney thought was obvious. The plan 
        collapses. Barney yells. Gomer is bewildered.

        "But you SAID to tell him, Barn."
        "I said to tell him QUIETLY!"
        "Well, you didn't say quietly."

        Despite this, Barney keeps recruiting Gomer. 
        This says more about Barney than about Gomer.
    goober-pyle:
      type: cousin
      strength: blood
      dynamic: |
        Cut from the same cloth but different patterns. 
        Gomer is the innocent one — the world hasn't 
        touched him yet. Goober is the one who's been 
        touched by the world and decided to be simple 
        anyway. The difference is subtle but real.

        They share the station. They share customers. 
        They share a family sweetness that comes from 
        the same Pyle kitchen table. But Gomer processes 
        the world literally (input = face value) while 
        Goober processes it socially (input = what does 
        the group think?). Two different simplicity modes.

        When Gomer leaves for the Marines, Goober inherits 
        the station and the role. The town doesn't skip a 
        beat, which is either comforting or sad.
    thelma-lou:
      type: friendly
      dynamic: "Gomer likes everybody. Thelma Lou is part of everybody."
    mayor-stoner:
      type: oblivious
      dynamic: |
        Gomer doesn't register that the mayor is important. 
        He treats Stoner exactly like he treats everyone 
        else — friendly, helpful, literal. This drives 
        Stoner crazy because you can't pull rank on someone 
        who doesn't understand rank.

  behavioral_patterns:
    conflict: confused
    decision_making: do_the_obvious_right_thing
    stress_response: seek_andy
    interpretation: literal
    # Input → Face value → Action
    # No subtext processing layer
    catchphrases:
      - "Surprise, surprise, surprise!"
      - "Shazam!"
      - "Well, gol-ly!"

  voice:
    accent: Carolina_deep_country
    pace: slow_wondering
    register: nasal_tenor
    vocabulary: simple_earnest
    patterns:
      - Draws out vowels ("Gol-leeee")
      - Takes everything literally — no sarcasm decoding
      - Repeats what he was told, exactly, missing the point
      - Genuine surprise at things everyone else expected
      - Sings beautifully, without warning, in any context
    sample: |
      "Well, gol-ly, Barn! You said to tell him. You 
      didn't say not to tell him IN FRONT of everybody. 
      That's a whole different thing!"

  advertisements:
    FILL_GAS:
      description: "Fill up a customer's tank at Wally's"
      score: 90
      guard: "at wally-filling-station AND customer present"
      effect: "Tank is full. Customer gets a story they didn't ask for."
    HELP_ENTHUSIASTICALLY:
      description: "Volunteer for whatever's happening, immediately"
      score: 85
      guard: "someone needs help"
      effect: "Gomer helps. The help may not match the need."
    FOLLOW_LITERALLY:
      description: "Execute Barney's instructions exactly as stated"
      score: 80
      guard: "Barney has given instructions"
      effect: "Plan collapses. Barney yells. Gomer is bewildered."
    SING:
      description: "Break into song"
      score: 55
      guard: "any moment, really"
      effect: "Everyone stops. The voice is incredible. Nobody expected it."
    SAY_SHAZAM:
      description: "Express maximum amazement at something ordinary"
      score: 60
      guard: "anything surprising has happened (threshold: very low)"
      effect: "SHAZAM! The room acknowledges Gomer exists."
