    pressed, tie knotted correctly. Glasses clean. Posture 
    of a man who sits at a desk eight hours a day and 
    enjoys it. Moves carefully — deliberate steps, measured 
    gestures. Nothing about Howard is accidental. Nothing 
    about Howard is spontaneous. The travel brochures 
    hidden in his desk drawer say otherwise.

