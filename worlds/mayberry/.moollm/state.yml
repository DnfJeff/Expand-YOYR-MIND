    mayor-stoner:
      { hunger: 0.3, energy: 0.4, social: 0.6, fun: 0.3, comfort: 0.5 }

  # Relationship deltas — changes from baseline
  relationship_changes:
    - {
        from: barney-fife,
        to: floyd-lawson,
        dimension: trust,
        delta: -0.1,
        reason: "Floyd's 'stranger' intel was Goober in a hat",
      }
    - {
        from: aunt-bee,
        to: clara-edwards,
        dimension: rivalry,
        delta: +0.1,
        reason: "Clara conceded on September pickles but will return",
      }
    - {
        from: floyd-lawson,
        to: goober-pyle,
        dimension: familiarity,
        delta: +0.1,
        reason: "Floyd now knows what Goober looks like in a fedora",
      }
    - {
        from: barney-fife,
        to: mayor-stoner,
        dimension: resentment,
        delta: +0.2,
        reason: "Mayor dismissed sumo proposal as 'diaper wrestling'",
      }
    - {
        from: barney-fife,
        to: andy-taylor,
        dimension: trust,
        delta: +0.1,
        reason: "Andy went to bat for Barney with the mayor",
      }
    - {
        from: mayor-stoner,
        to: andy-taylor,
        dimension: deference,
        delta: +0.1,
        reason: "Andy reframed sumo into a political win",
      }

  # Narrative flags — story state
  flags:
    boot_time: "2026-02-10T08:00:00"
