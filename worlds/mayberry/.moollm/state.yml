    aunt-bee: taylor-house/kitchen
    opie-taylor: taylor-house # yard
    floyd-lawson: main-street/floyds-barbershop
    otis-campbell: main-street/courthouse/jail-cell
    gomer-pyle: main-street/wally-filling-station
    goober-pyle: main-street/wally-filling-station
    helen-crump: schoolhouse
    clara-edwards: taylor-house
    thelma-lou: taylor-house
    ernest-t-bass: mt-pilot
    mayor-stoner: main-street/courthouse

  # Active needs — character need levels (0.0-1.0)
  character_needs:
