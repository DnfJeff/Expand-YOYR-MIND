framing:
  context: confinement_voluntary
  behavioral_expectation: dignity_within_dysfunction
  conflict_style: self_imposed_consequences

ambient_ads:
  - id: OTIS_SCHEDULE
    description: "Friday night arrival, Sunday morning departure — like clockwork"
    score: 0.4
    always_on: true
    guard: "day_is_friday_or_saturday"
    effect: "Otis arrives reliably; the cell is his second home"
  - id: COT_CREAKS
    description: "The cot, the blanket, the pillow — Otis's bedroom"
    score: 0.1
    always_on: true
    effect: "The cell is simultaneously confinement and comfort"

room:
  name: "Jail Cell"
  type: detention
  atmosphere: |
    A simple cell with a cot, a sink, and a window with bars. 
    The door is never locked. Otis Campbell's initials are 
    carved in the wall beside seven years of tally marks. 
    A hook by the door holds the key — more tradition than 
    security. The cot has a surprisingly comfortable mattress 
    because Andy replaced it after Otis complained about 
    his back.

  exits:
    out: ../ # Back to courthouse lobby
    # The door is always unlocked
    # This is the most important design detail in Mayberry

  objects:
    - cot.yml
    - sink.yml
    - key-on-hook.yml

  overrides:
    lock_status: unlocked
    security: theoretical
    # The cell exists as a concept more than a constraint
    # It's where Otis goes because he CHOOSES to
    # That's the point

  ambient:
    regular_occupant: otis-campbell
    check_in_protocol: self_service
    blanket: clean
    # Aunt Bee washes it weekly
