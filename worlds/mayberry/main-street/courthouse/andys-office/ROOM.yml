framing:
  context: civic_personal
  behavioral_expectation: wisdom_over_authority
  conflict_style: listen_then_advise

ambient_ads:
  - id: DESK_GRAVITY
    description: "The desk draws people in — anyone with a problem ends up here"
    score: 0.3
    always_on: true
    effect: "Characters bring problems to Andy; the desk is a magnet"
  - id: PHONE_RINGS
    description: "The phone connects Andy to every crisis in town"
    score: 0.2
    always_on: true
    effect: "New problems arrive by phone; plans change"

room:
  name: "Andy's Office"
  type: office
  atmosphere: |
    A wooden desk with a swivel chair. A gun rack on the wall — 
    Andy's rifle, rarely touched. A coffee maker that's always on. 
    Two chairs in front of the desk for visitors, which is everyone 
    in town at some point. The window looks out at Main Street.

  exits:
    out: ../ # Back to courthouse lobby

  objects:
    - desk.yml
    - gun-rack.yml
    - coffee-maker.yml
    - phone.yml
    - filing-cabinet.yml

  ambient:
    mood: calm
    purpose: conflict_resolution
    # This room is where problems come to be solved
    # Not through law, through conversation
    # Andy's chair faces the visitor chairs, not the wall
    # That's not an accident
