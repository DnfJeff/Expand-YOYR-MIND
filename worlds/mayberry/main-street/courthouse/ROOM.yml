# Container inheritance — children inherit these unless overridden
inherits:
  - locations/abstract/civic-authority

defaults:
  authority_level: legal_but_gentle
  tone: orderly_with_coffee
  accessibility: public_hours
  formality: low_despite_function
  governing_style: conversation_before_citation
  # Andy's approach cascades to every room in this building:
  # the law is a tool for helping people, not punishing them.

framing:
  context: civic_authority
  behavioral_expectation: respect_with_informality
  conflict_style: andy_mediates_barney_escalates
  # The courthouse is technically law enforcement
  # but Andy keeps it feeling like a community center.

ambient_ads:
  - id: COFFEE_IS_ON
    description: "The coffee pot is always going — come in, sit down"
    score: 0.3
    always_on: true
    effect: "Transforms authority space into social space"
  - id: BARNEY_VIGILANCE
    description: "Barney monitors for infractions real and imagined"
    score: 0.2
    always_on: true
    guard: "barney_is_present"
    effect: "Minor infractions get noticed and cited; Andy overrules"

room:
  name: "Mayberry Courthouse"
  type: civic
  atmosphere: |
    A solid brick building that smells like old paper and 
    floor polish. The bulletin board inside the front door 
    has notices about church suppers, lost cats, and a 
    wanted poster that hasn't been updated since 1957. 
    Ceiling fans turn slowly. Everything about this building 
    says "we have time."

  exits:
    out: ../ # Back to Main Street
    office: andys-office/
    cell: jail-cell/
    upstairs: courtroom/
    records: records-room/

  objects:
    - bulletin-board.yml
    - water-cooler.yml
    - hat-rack.yml

  ambient:
    authority_level: gentle
    # The courthouse is technically law enforcement
    # but it feels like a living room with filing cabinets
    foot_traffic: moderate
