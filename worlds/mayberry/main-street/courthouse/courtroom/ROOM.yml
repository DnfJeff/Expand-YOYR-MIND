framing:
  context: formal_civic
  behavioral_expectation: legal_formality_attempt
  conflict_style: procedures_nobody_quite_remembers

ambient_ads:
  - id: FORMALITY_PRESSURE
    description: "Everyone tries to be formal and mostly fails"
    score: 0.2
    always_on: true
    effect: "Language becomes stiff; Barney thrives; Andy tolerates"

room:
  name: "Courtroom"
  type: judicial
  atmosphere: |
    A formal courtroom on the second floor. Dark wood benches, 
    a judge's bench, witness stand, and the town seal on the 
    wall. Dust motes float in the light from tall windows. 
    This room is rarely used — Mayberry settles most things 
    downstairs in Andy's office or on someone's porch.

  exits:
    downstairs: ../ # Back to courthouse lobby

  ambient:
    usage: infrequent
    formality: high
    # When cases DO come here, it's a big deal
    # The whole town shows up
    # It becomes theater
