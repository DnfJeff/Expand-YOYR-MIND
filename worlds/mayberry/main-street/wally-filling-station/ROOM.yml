# Container inheritance — children inherit these unless overridden
inherits:
  - locations/abstract/service-business

defaults:
  tone: working_friendly
  mechanical_competence: high
  authority: pyle-cousins
  sound_baseline: radio_and_tools
  smell_baseline: gasoline_and_oil
  # Wally owns it. The Pyles run it.
  # Don't let the overalls fool you.

framing:
  context: working_commercial
  behavioral_expectation: helpful_and_honest
  conflict_style: explain_then_fix
  # The Pyles may explain badly but they fix perfectly.

ambient_ads:
  - id: GOMER_GREETING
    description: "'Hey! Hey!' — Gomer greets every customer with maximum enthusiasm"
    score: 0.3
    always_on: true
    guard: "gomer_is_present"
    effect: "Every arrival becomes an event; customer may not get a word in"
  - id: MECHANICAL_SOUNDS
    description: "Wrenches, engines, radio — the shop is never quiet"
    score: 0.2
    always_on: true
    effect: "Working atmosphere grounds conversations in physicality"

room:
  name: "Wally's Filling Station"
  type: commercial
  atmosphere: |
    Two gas pumps out front, a garage bay around the side. 
    The office has a cash register, a rack of road maps nobody 
    buys, and a coffee pot that's been on since morning. Oil 
    stains on the concrete tell the history of every car in 
    Mayberry. Gomer or Goober is always here, usually both.

  exits:
    out: ../ # Back to Main Street
    garage: garage-bay/

  objects:
    - gas-pumps.yml
    - cash-register.yml
    - road-maps.yml
    - coffee-pot.yml
    - vending-machine.yml

  ambient:
    sound: radio_and_tools
    smell: gasoline_and_oil
    mechanical_competence: high
    # The Pyle cousins may seem dim but they can rebuild
    # any engine in town blindfolded

  occupants:
    primary: [gomer-pyle, goober-pyle]
    owner: wally
    # Wally is rarely seen — the Pyles run the place
