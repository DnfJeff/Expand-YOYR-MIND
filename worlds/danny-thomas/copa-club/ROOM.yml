# Container inheritance — children inherit these unless overridden
inherits:
  - locations/abstract/showbiz-venue

defaults:
  tone: professional_showbiz
  energy: performance_anticipation
  authority: phil-brokaw
  formality: nightclub_elegant
  sound_baseline: jazz_trio_warming_up
  # The Copa overrides domestic chaos.
  # Everything here is curated, intentional, professional.
  # Danny becomes DANNY here.

framing:
  context: professional_entertainment
  behavioral_expectation: polished_curated_professional
  conflict_style: handled_offstage
  # The audience never sees the problems.
  # Phil handles the machine. Danny handles the magic.

ambient_ads:
  - id: SHOWTIME_APPROACHING
    description: "The clock is always ticking toward curtain"
    score: 0.4
    always_on: true
    effect: "Urgency builds through the evening — everything serves the show"
  - id: AUDIENCE_ENERGY
    description: "The crowd's anticipation is palpable — drinks ordered, tables filling"
    score: 0.3
    always_on: true
    effect: "Social energy elevates — everyone performs slightly, even the audience"

room:
  name: "Copa Club"
  type: nightclub
  atmosphere: |
    A Manhattan supper club with the lights turned low. 
    Round tables with white tablecloths ring a small stage. 
    A bar along the back wall catches the light. The band 
    sets up behind the performer. The ceiling is low enough 
    that Danny's voice fills the room without a microphone, 
    though he uses one anyway. It smells like cologne, 
    cigarettes, and prime rib.

  exits:
    stage: stage/
    backstage: backstage/
    office: managers-office/
    out: ../new-york-streets/theater-district

  overrides:
    tone: professional_showbiz
    # The Copa overrides the domestic chaos tone
    # This is a curated space
    # Everything here is intentional
    governance:
      authority: phil-brokaw
      # Danny runs the stage; Phil runs the room
      # Clear jurisdictions, mutual respect

  ambient:
    sound: jazz_trio_warming_up
    lighting: atmospheric
    energy: anticipation
    # Every night before the show, the room hums
    # The audience is arriving, ordering drinks
    # The band is tuning
    # Danny is backstage preparing to become himself
