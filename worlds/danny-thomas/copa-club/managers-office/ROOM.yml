framing:
  context: business_backstage
  behavioral_expectation: professional_negotiation
  conflict_style: contracts_and_compromise

ambient_ads:
  - id: BOOKS_OPEN
    description: "The ledger tells the truth the audience never sees"
    score: 0.2
    always_on: true
    effect: "Business reality grounds artistic ambition"
  - id: PHONE_RINGING
    description: "Agents, acts, problems — Phil handles them all"
    score: 0.3
    always_on: true
    effect: "New opportunities or crises arrive by phone"

room:
  name: "Manager's Office"
  type: office
  atmosphere: |
    Phil Brokaw's domain. A desk covered with booking 
    sheets, contracts, and promotional photos. A phone 
    that never stops ringing. Framed photos of past 
    performers on the walls. The business side of 
    show business — less glamorous, more math.

  exits:
    club: ../ # Into the club floor

  objects:
    - desk.yml
    - phone.yml
    - booking-calendar.yml
    - contracts.yml
    - promotional-photos.yml

  ambient:
    function: business
    # The Copa is art in front and spreadsheets in back
    # Phil handles the spreadsheets
    # Danny handles the art
    # Charley Halper shows up here to argue about money
    occupant: phil-brokaw
