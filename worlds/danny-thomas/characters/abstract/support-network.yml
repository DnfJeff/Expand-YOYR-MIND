  type: abstract_character
  name: "Support Network"
  description: "Person who provides emotional and practical support to the central family"
  default_traits:
    reliability: 0.9
    availability: 0.8
    own_life_visibility: 0.3
    warmth: 0.8
  default_needs:
    being_included: 0.7
