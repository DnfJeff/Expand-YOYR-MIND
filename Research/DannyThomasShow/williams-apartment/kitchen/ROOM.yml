room:
  name: "Williams Kitchen"
  type: domestic
  atmosphere: |
    A Manhattan kitchen — smaller than Aunt Bee's but 
    efficiently organized. Kathy runs this space with quiet 
    competence. The coffee pot is always on. There's always 
    something in the oven because someone might stop by. 
    Lebanese and American groceries share shelf space.

  exits:
    living_room: ../living-room

  objects:
    - stove.yml
    - kitchen-table.yml
    - coffee-pot.yml
    - refrigerator.yml
    - spice-rack.yml

  ambient:
    ruler: kathy-williams
    # Like Aunt Bee's kitchen, this is sovereign territory
    # Danny does not govern here
    # He is a guest in his own kitchen
    # He knows this
    
    cultural_blend: true
    # The spice rack tells the story:
    # Cumin next to oregano
    # Za'atar next to garlic salt
    # Two food traditions in one kitchen
    
    diplomacy_center: true
    # Kathy and Bunny solve EVERYTHING over coffee here
    # While Danny and Charley yell in the living room,
    # the actual solutions happen at this table
    
    tonoose_override: true
    # When Tonoose visits, he takes over this kitchen
    # Kathy lets him because fighting it is pointless
    # And honestly, his kibbeh is incredible
