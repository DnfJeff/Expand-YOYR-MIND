world:
  name: "Danny Williams' New York"
  city: "New York City"
  borough: "Manhattan"
  era: 1950s-1960s
  tone: warm_chaos
  # The tone is NOT gentle like Mayberry
  # It's warm but LOUD
  # Love expressed through argument, dramatic gesture,
  # and Lebanese cooking

  governance:
    style: benevolent_chaos
    authority: danny-williams
    method: exasperated_love
    # Danny tries to control his household
    # The household has other plans
    # Kathy actually runs things
    # Danny knows this but can't admit it

  rules:
    volume: high
    # Conversations in this world are PERFORMED
    # Every discussion is a scene
    # Even ordering dinner is an act
    visitors: constant
    # The door is always opening
    # Someone is always arriving
    # Plans are always changing
    cultural_blend: lebanese_american
    # Two cultures in one kitchen
    # American practicality meets Lebanese generosity
    # Both insist on feeding you

  atmosphere: |
    New York City in its golden age of nightclubs and TV. 
    The apartment is on the Upper West Side, comfortable 
    but not extravagant. Danny makes a good living but 
    he's not rich — he's a working entertainer who takes 
    the subway. The city is a character: noisy, exciting, 
    exhausting, and always offering another complication.

  social_dynamics:
    visitor_frequency: high
    visitor_impact: disruptive_loving
    family_structure: extended_to_infinity
    # Danny's family extends outward like radio waves
    # Every cousin has a cousin
    # Every cousin's cousin has a need
    hospitality: non_negotiable
    # You feed guests. This is not optional.
    # Lebanese hospitality meets New York apartment size.
    # The math doesn't work. They do it anyway.

  time_rhythm:
    morning: family_breakfast_chaos
    daytime: kathy_manages_household
    afternoon: danny_rehearses_or_deals_with_crisis
    evening: copa_club_performance
    late_night: danny_comes_home_exhausted
    # The show's rhythm is Danny leaving and returning
    # Each departure and return changes the equation

  delegation:
    cascades:
      - era
      - tone
      - rules
      - cultural_blend

  simulate:
    # Speed-of-Light: how many turns per LLM call
    speed_of_light:
      max_turns_per_call: 8
      max_characters_per_turn: 5
      # Danny's world is louder — more people talking at once

    epochs:
      morning:
        starts: 7:00AM
        ends: 12:00PM
        tone_shift: family_breakfast_chaos
        typical_locations: [williams-apartment, kitchen, kids-rooms]
      afternoon:
        starts: 12:00PM
        ends: 5:00PM
        tone_shift: kathy_manages_danny_rehearses
        typical_locations: [williams-apartment, copa-club, new-york-streets]
      pre_show:
        starts: 5:00PM
        ends: 8:00PM
        tone_shift: getting_ready_anticipation_builds
        typical_locations: [copa-club, backstage, dannys-den]
      show_time:
        starts: 8:00PM
        ends: 11:00PM
        tone_shift: spotlight_on_danny_becomes_DANNY
        typical_locations: [copa-club, stage]
      late_night:
        starts: 11:00PM
        ends: 1:00AM
        tone_shift: danny_comes_home_exhausted
        typical_locations: [williams-apartment, living-room, building-lobby]
        # The door opens. Kathy is still up.
        # "How was the show?" "You wouldn't believe..."

    tick_config:
      duration: 10_minutes_world_time
      # Danny's world moves faster than Mayberry
      actions_per_tick: 1
      evaluation_order: highest_scoring_ad_first
      interruption_probability: 0.3
      # 30% chance any action gets interrupted
      # Because the doorbell is always ringing

    persistence:
      log: LOG.md
      transcript: TRANSCRIPT.md
      state_files: "**/*.yml"
      save_frequency: every_epoch_boundary

    reading_protocol:
      cold_start: GLANCE.yml
      warm_start: CARD.yml
      deep_dive: "*.md"
      order: [GLANCE, CARD, SKILL, README]
