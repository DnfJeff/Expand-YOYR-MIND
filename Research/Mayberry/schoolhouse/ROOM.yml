# Container inheritance — children inherit these unless overridden
inherits:
  - locations/abstract/educational-ground

defaults:
  authority: helen-crump
  tone: structured_with_warmth
  schedule_bound: true
  social_register: children_and_teacher
  moral_context: learning_through_experience
  # Helen runs everything in this building's orbit.
  # Even the playground answers to her whistle.

framing:
  context: educational_structured
  behavioral_expectation: learning_and_growth
  conflict_style: lessons_and_consequences
  # Helen teaches. The children learn.
  # Sometimes the lesson is in the textbook.
  # Usually it isn't.

ambient_ads:
  - id: SCHOOL_RULES
    description: "Raise your hand. Wait your turn. Respect the teacher."
    score: 0.2
    always_on: true
    effect: "Structure constrains behavior — even Opie follows the rules here"
  - id: BELL_RHYTHM
    description: "The school bell marks time — class, recess, dismissal"
    score: 0.2
    always_on: true
    effect: "Time is externally enforced; transitions are sharp"

room:
  name: "Mayberry Schoolhouse"
  type: educational
  atmosphere: |
    A brick schoolhouse with a flag out front and a 
    playground around the side. Helen Crump's classroom 
    has rows of wooden desks, a chalkboard, a globe, 
    and a map of North Carolina that's slightly out of date. 
    The cloakroom smells like wet galoshes in winter and 
    grass in spring.

  exits:
    out: ../main-street # Back toward town
    playground: playground/

  objects:
    - desks.yml
    - chalkboard.yml
    - globe.yml
    - teachers-desk.yml
    - flag.yml

  ambient:
    authority: helen-crump
    function: education
    # Helen runs this room with competence and warmth
    # The children respect her because she respects them
    social_register: children_and_teacher

  schedule:
    school_day: 8:00AM-3:00PM
    recess: 10:30AM
    lunch: 12:00PM
