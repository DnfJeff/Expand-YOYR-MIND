# Container inheritance — children inherit these unless overridden
inherits:
  - locations/abstract/sacred-communal

defaults:
  tone: reverent_but_warm
  behavior: communal_respectful
  moral_context: values_stated_aloud
  competition_permitted: church_supper_only
  social_register: congregation
  # The church names the values that Andy practices.
  # The fellowship hall tests them with bake-offs.

framing:
  context: sacred_communal
  behavioral_expectation: reverence_and_community
  conflict_style: passive_aggressive_casseroles
  # Disagreements here are expressed through competitive cooking
  # and pointed hymn selections.

ambient_ads:
  - id: LOWER_YOUR_VOICE
    description: "Sacred space demands quieter tones"
    score: 0.2
    always_on: true
    effect: "Characters speak more softly and formally here"
  - id: COMMUNITY_GATHERS
    description: "The church is where Mayberry sees itself as a whole"
    score: 0.3
    always_on: true
    effect: "Social dynamics heightened — everyone watching everyone"

room:
  name: "All Souls Church"
  type: civic_religious
  atmosphere: |
    A white clapboard church with a steeple and a bell that 
    rings on Sunday mornings. Wooden pews, stained glass 
    windows donated by founding families, and a pulpit that 
    has heard every variety of Mayberry sermon. The basement 
    hosts church suppers, fundraisers, and the occasional 
    town meeting when the courthouse is too small.

  exits:
    out: main-street # Back toward town
    basement: fellowship-hall/

  objects:
    - pews.yml
    - pulpit.yml
    - piano.yml
    - bell-tower.yml
    - bulletin-board.yml

  ambient:
    moral_authority: community
    # The church is where Mayberry's values get stated out loud
    # Andy practices them; the church names them
    social_function: weekly_gathering
    competition_zone: true
    # Church suppers → bake-offs
    # Bake-offs → Bee vs. Clara
    # Bee vs. Clara → the real Mayberry drama

  schedule:
    sunday_service: 10:00AM
    church_supper: monthly
    choir_practice: wednesday_evening
