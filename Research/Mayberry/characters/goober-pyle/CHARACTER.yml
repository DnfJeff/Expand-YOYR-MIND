character:
  name: "Goober Pyle"
  role: "Gas Station Mechanic, Wally's Filling Station"
  home: characters/goober-pyle/
  location: main-street/wally-filling-station

  personality:
    traits: [simple, loyal, mechanical_genius, gullible, good-natured]
    # Goober can take apart a car engine blindfolded
    # but can't navigate a social situation without a map
    # His intelligence is domain-specific and genuine

  sims_traits:
    neat: 3 # Perpetually grease-stained
    outgoing: 6 # Friendly, follows the crowd
    active: 5 # Works hard when motivated
    playful: 7 # Loves fun, impressions, goofing around
    nice: 8 # Sweet-natured to the core

  needs:
    belonging:
      level: moderate
      description: "Wants to be included with the guys"
    competence:
      level: satisfied
      description: "Knows he's good with engines"
    fun:
      level: high
      description: "Loves hanging out, doing bits"

  relationships:
    gomer-pyle:
      type: cousin
      strength: blood
      dynamic: |
        Goober and Gomer are the Pyle boys — same DNA, 
        different operating systems. Gomer runs on 
        literal interpretation: input goes in, face 
        value comes out, no processing layer. Goober 
        runs on social mirroring: input goes in, 
        "what does everyone else think?" gets checked, 
        output matches the group.

        At the station they're interchangeable to 
        customers, which both accept without resentment. 
        When Gomer ships out to the Marines, Goober 
        steps into the role like a socket wrench clicking 
        into the right size. The town's Pyle-shaped hole 
        stays Pyle-shaped.
    andy-taylor:
      type: friend
      strength: warm
      dynamic: |
        Goober looks up to Andy like everyone does, 
        but with less complexity than Barney and less 
        worship than Gomer. Andy is the guy you want 
        to have a Coke with. Andy humors Goober's 
        impressions. Andy never mocks the beanie cap.
    barney-fife:
      type: willing_accomplice
      dynamic: |
        Goober is an easier co-conspirator than Gomer 
        for Barney's schemes. Where Gomer demolishes plans 
        through literalness, Goober demolishes them through 
        over-enthusiasm. He goes along TOO readily, adds 
        his own embellishments, tells the wrong person, 
        or gets so excited about the scheme that he forgets 
        what the scheme was actually for.

        Barney prefers Goober anyway because at least 
        Goober understands the CONCEPT of a secret plan, 
        even if he can't keep one.
    mayor-stoner:
      type: constituent
      dynamic: |
        Goober votes. Goober talks at Floyd's about 
        who he votes for. The mayor knows this and 
        treats Goober with the careful friendliness 
        of a politician who needs every ballot.
    floyd-lawson:
      type: hangout_buddy
      dynamic: |
        Floyd's barbershop is Goober's social home base. 
        He leans in the doorway, sits in the extra chair, 
        does his Cary Grant impression whether anyone 
        asked or not. Floyd tolerates it because Goober 
        laughs at Floyd's stories, and everyone needs 
        an audience.
    thelma-lou:
      type: friendly
      dynamic: "Goober likes Thelma Lou fine. He doesn't notice the triangle."

  behavioral_patterns:
    conflict: go_along
    decision_making: follow_others
    stress_response: tinker_with_something_mechanical
    special_skill: mechanical_intuition
    # Give Goober a broken engine and he's a savant
    # Give him a social puzzle and he's lost
