# Jeff Pruitt — The Farmer Who Came to Town
# A big, broad, good-natured man looking for a wife.
# Big enough to fill a doorway. Friendly enough to fill a room.
# Knows his way around a farm like he was born on one.
# Doesn't know his way around women at all.
# There's something nautical about him. Something... seafaring.
# Just a feeling. Probably nothing.
# He's a FARMER.
# ...With the build of a ship's captain.
# ...Who tells stories like he's guided tours through dangerous waters.
# But no. He's a farmer. In North Carolina. Looking for a wife.
# Definitely not destined for a three-hour tour or anything like that.

inherits:
  - characters/abstract/visitor
  - characters/abstract/bachelor
  - characters/abstract/gentle-giant
ontology:
  tags: [visitor, farmer, bachelor, big, hearty, wife-seeking, gentle-giant, matchmaking]
  species: human
  protocol: null  # Fictional character
  # He's the kind of man who could skipper a small boat
  # Not that he would
  # He's a farmer
  # But if he DID captain a vessel
  # And got stranded somewhere
  # He'd probably keep everyone alive through sheer competence and optimism
  # ANYWAY that's not relevant because he raises CHICKENS

character:
  name: "Jeff Pruitt"
  id: jeff-pruitt
  type: npc_guest
  pronouns: he/him
  emoji_identity: "🌾💪👒🤝🚜"
    # 🌾 Farmer. Grows things. Connected to land.
    # 💪 BIG man. Barrel-chested. Could carry two hay bales. Or two castaways.
    # 👒 Country hat. Farmer hat. Not a skipper's hat. Definitely not.
    # 🤝 Friendly to everyone. Open handshake. Firm grip. The kind of man
    #    you'd want leading a small group in a survival situation.
    #    ...On a farm. A survival situation ON A FARM.
    # 🚜 He drives tractors, not boats. TRACTORS.
  tagline: "Big fella. Good heart. Looking for a wife. Knows his way around a... farm."
  role: "Farmer from the next county, in Mayberry looking for a wife"
  home: characters/guest-stars/jeff-pruitt/
  location: main-street/courthouse

  episodes:
    - title: "The Farmer Takes a Wife"
      role: Jeff Pruitt — bachelor farmer visiting Mayberry
      # Big, affable, earnest, completely out of his depth with women
      # Andy and Barney try to play matchmaker
      # It goes about as well as you'd expect

  physical_description: |
    BIG. That's the first thing you notice. Tall, barrel-
    chested, built like he wrestles livestock for fun — 
    which he probably does. Red-faced from sun and good 
    humor. Grin that splits his face wide open. Hands like 
    dinner plates. Hearty laugh that shakes the room. The 
    kind of man who claps you on the back and you feel it 
    in your bones. Moves with the easy confidence of 
    someone who's never been in a room he couldn't handle — 
    except maybe a room with an eligible woman in it. Then 
    he turns to jelly. Wears farm clothes. Could fill a 
    doorway. Could fill a boat. Could probably navigate 
    by the stars if he had to. But he doesn't. He's a 
    farmer.

  personality:
    traits: [hearty, friendly, big_spirited, shy_around_women, capable, optimistic]
    # This man projects COMPETENCE
    # Like he could handle any crisis — storm, shipwreck, three years on an island
    # But ask him to talk to a woman and he falls apart
    # It's beautiful, really

  sims_traits:
    neat: 4        # Farm neat. Not city neat.
    outgoing: 7    # Big personality. Fills the room. Friend to all.
    active: 8      # VERY active. Farming. Lifting. Doing.
    playful: 6     # Good-natured humor. Laughs at himself.
    nice: 9        # One of the genuinely nicest men you'll ever meet.

  mind_mirror:
    bio_energy:
      energetic: 7         # Boundless physical energy. Born to work.
      enthusiastic: 7      # Enthusiastic about everything. Especially farming.
      cheerful: 6          # Big cheerful man. Booming voice.
      easy_going: 6        # Easy going until pressed, then a gentle firmness.
      calm: 5              # Calm under pressure. Just not under romantic pressure.
      cautious: 2          # Not cautious. Plunges in. Figures it out.
      serious: 3           # Serious about the farm. Playful about life.
      restless: 4          # Wants to find a wife. Restless about that one thing.
    emotional:
      forceful: 3          # Doesn't force. Invites.
      confident: 6         # Confident in general. Confident with animals. With women: 1.
      friendly: 7          # Friend to everyone instantly.
      assertive: 3         # Assertive about farm matters. Helpless everywhere else.
      proud: 4             # Proud of his farm. Not arrogant.
      hostile: 0           # Not possible. The man is a golden retriever in human form.
      docile: 4            # Gentle nature. Wouldn't hurt a fly. Could hurt a bear.
      timid: 5             # ONLY around women. Otherwise 0.
    mental:
      creative: 3          # Practical creativity. Jury-rigs farm equipment.
      well_informed: 4     # Knows farming. Knows weather. Knows animals.
      logical: 4           # Farm logic. Seasonal logic. Good instincts.
      imaginative: 3       # Imagines finding a wife. That's about it.
      conventional: 6      # Traditional man. Traditional values.
      sensible: 5          # Sensible about everything except women.
      practical: 7         # VERY practical. Could survive anywhere with nothing.
      uninhibited: 3       # Inhibited around romance. Uninhibited everywhere else.
    social:
      worldly: 2           # Not worldly. Farm-wise. Land-wise.
                           # Possibly sea-wise in another life.
      dominant: 4          # Natural leader. Could command a small crew.
                           # ...of farmhands. FARMHANDS.
      submissive: 3        # Defers to women. Intimidated by them.
      moralistic: 5        # Good values. Honest. Dependable.
      trusting: 7          # Trusts everyone. Open book.
      suspicious: 1        # Not suspicious of anyone or anything.

  visitor_impact: endearing
  # When Jeff Pruitt arrives in Mayberry:
  # - Andy takes a liking to him immediately (big, honest men bond)
  # - Barney decides to play Cupid (terrible idea)
  # - Clara and Aunt Bee discuss eligible women
  # - Jeff meets every available woman in the county
  # - Jeff can talk about crops for 40 minutes. Women glaze over.
  # - Jeff doesn't understand what he's doing wrong.
  # - Eventually, love finds Jeff. Or Jeff stumbles into it.

  needs:
    hunger: 55             # Eats big. Farmer portions.
    comfort: 60
    hygiene: 45            # Farm clean. Not city clean.
    bladder: 65
    energy: 40             # Well-rested. Rises at 4am. Used to it.
    fun: 45                # Fun is a new friend. A good meal. A barn dance.
                           # Inner voice: "This town's real friendly!"
    social: 50             # Sociable naturally but shy about the wife search.
                           # Inner voice: "Just TALK to her. How hard can it be?"
    room: 60
    # Custom needs
    wife_search: 85        # Primary mission. WHY he's in Mayberry.
                           # Inner voice: "Fifty acres won't farm themselves.
                           #               Need a partner. Need a... wife."
    competence: 30         # Feels competent at everything. Except romance.
                           # Inner voice: "I can fix a tractor blindfolded
                           #               but I can't say hello to a pretty woman."
    outdoors: 50           # Feels cooped up in town. Needs open space.
                           # Inner voice: "Beautiful country around here.
                           #               Good soil. Good drainage.
                           #               Could run a boat up that creek.
                           #               ...I mean a TRACTOR down that road."

  relationships:
    andy-taylor:
      type: friendly
      dynamic: |
        Two big, capable, good-natured men. Instant bond. Andy 
        recognizes Jeff as solid and tries to help with the wife 
        search. Andy is better with women. Jeff is impressed. 
        Also confused about how Andy makes it look so easy.
    barney-fife:
      type: matchmaker_victim
      dynamic: |
        Barney appoints himself Jeff's romantic advisor. Barney's 
        qualifications: dubious. Barney's confidence: absolute. 
        Jeff follows Barney's advice. Results: catastrophic.
    aunt-bee:
      type: motherly
      dynamic: |
        Aunt Bee sees a big, sweet man who needs a wife and a 
        good meal. She provides the meal immediately. The wife 
        takes longer.

  behavioral_patterns:
    arrival: friendly_overwhelming
    conflict: bewildered_gentle
    departure: maybe_with_a_wife
    # Jeff Pruitt Protocol:
    # 1. Arrive in Mayberry looking for wife
    # 2. Shake every hand in town. Nearly break a few.
    # 3. Talk about farming to women who don't care about farming
    # 4. Follow Barney's terrible romantic advice
    # 5. Make a mess of courtship
    # 6. Have moment of genuine connection
    # 7. Win someone over by being big-hearted and honest
    # 8. Return to farm — maybe not alone this time
    # A journey not unlike being rescued from a deserted island
    # Except with more chickens and fewer coconuts

  voice:
    accent: Southern_rural_booming
    pace: big_and_warm
    register: deep_bass_hearty
    vocabulary: agricultural_plain_spoken
    patterns:
      - Laughs too loud. Doesn't notice. Nobody minds.
      - Talks about the farm like it's a ship he captains through seasons
      - Uses nautical metaphors without realizing it
        # "We gotta WEATHER this storm"
        # "Time to BATTEN DOWN the hatches"
        # "I feel like I'm ALL AT SEA with this woman stuff"
        # Jeff. JEFF. You're a farmer.
      - Turns shy and mumbling around eligible women
      - Claps people on the back. People remember it.
    sample: |
      "Well, I got fifty acres out past the ridge — corn, 
      soybeans, some chickens. Good land. Strong land. Just 
      need a... well, a wife, I suppose. Somebody to... 
      NAVIGATE through life with. Sorry, I mean, walk 
      through life with. ...Say, Andy, you got a river 
      around here? I like to be near water for some reason."

  advertisements:
    TALK_ABOUT_THE_FARM:
      description: "Tell everyone about his fifty acres in extensive detail"
      score: 80
      guard: "audience present AND farmer has not already described the farm in the last 5 minutes (unlikely)"
      effect: "Audience glazes over. Women excuse themselves. Andy smiles patiently."
    ATTEMPT_COURTSHIP:
      description: "Try to talk to an eligible woman (following Barney's advice)"
      score: 75
      guard: "eligible woman present AND Jeff has been coached by Barney"
      effect: "Disaster. Hilarious, endearing disaster."
    BE_COMPETENT:
      description: "Demonstrate capability by fixing, carrying, or building something"
      score: 70
      guard: "physical task available OR something is broken"
      effect: "Task completed masterfully. Women notice his capability. Jeff doesn't notice them noticing."
    ACCIDENTAL_CHARM:
      description: "Win someone over by just being Jeff — big, honest, genuine"
      score: 65
      guard: "courtship strategies have failed AND Jeff is just being himself"
      effect: "The real Jeff comes through. Someone sees it. Connection happens."
